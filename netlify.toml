[build]
  command = "corepack enable && pnpm install && pnpm build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/save-content"
  to = "/.netlify/functions/save-content"
  status = 200
  force = true

[[redirects]]
  from = "/api/upload-cv"
  to = "/.netlify/functions/upload-cv"
  status = 200
  force = true

[[redirects]]
  from = "/api/revert-content"
  to = "/.netlify/functions/revert-content"
  status = 200
  force = true

[[redirects]]
  from = "/api/ping"
  to = "/.netlify/functions/ping"
  status = 200
  force = true

# Resume/CV documents - release gate.
#
# Only the corrected English CV ("Franzetti Curriculum Vitae Sept. 2026 (EN)")
# is published. On 2026-09-19 the superseded documents were DELETED from the
# repository rather than merely blocked:
#     Franzetti-CV-Spanish.pdf, Franzetti-Mini-CV-Spanish.pdf,
#     Franzetti-CV-Portuguese.pdf, Franzetti-Mini-CV-Portuguese.pdf,
#     Franzetti-Mini-CV-English.pdf   (and the old ./cv-english.pdf at repo root)
# That matters because this repository is PUBLIC: a blocked Netlify route never
# protected these files from being downloaded straight off GitHub. Deleting them
# is the real control; the rules below are now a secondary gate.
#
# The rules stay in place as a release gate for the replacement Spanish and
# Portuguese CVs that are expected shortly. If a new PDF is committed while it is
# still under review, it cannot be reached by direct or bookmarked URL even
# though the file exists in the build output.
#
# TO PUBLISH A VARIANT (e.g. the new Spanish CV arrives):
#   1. place the PDF at the path in client/public/cv/
#   2. set that variant's flag to `true` in client/src/components/Footer.tsx
#      (CV_DOWNLOAD_ENABLED)
#   3. delete that one's [[redirects]] block below
#   4. add the variant to client/public/cv/cv.json if it is a full CV
# The verification harness asserts this consistency in both directions, so a
# mismatch (published but still blocked, or blocked but the flag already on)
# will fail the build checks rather than silently 404 a live link.
#
# These must stay ABOVE the SPA catch-all (first matching rule wins), and keep
# `force = true`: without it Netlify serves an existing static file in preference
# to the redirect and the block silently stops working.

[[redirects]]
  from = "/cv/Franzetti-Mini-CV-English.pdf"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/cv/Franzetti-CV-Spanish.pdf"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/cv/Franzetti-Mini-CV-Spanish.pdf"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/cv/Franzetti-CV-Portuguese.pdf"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/cv/Franzetti-Mini-CV-Portuguese.pdf"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers for Corporate Browser Compliance
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking attacks
    X-Frame-Options = "SAMEORIGIN"
    
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Enable XSS protection
    X-XSS-Protection = "1; mode=block"
    
    # Referrer policy for privacy
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Permissions policy (formerly Feature-Policy)
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    
    # Content Security Policy - allows necessary resources while blocking unsafe ones
    # Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';"
    
    # Strict Transport Security (HSTS) - enforce HTTPS
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Cross-Origin policies for additional security
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
