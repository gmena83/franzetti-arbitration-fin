[build]
  command = "corepack enable && pnpm install && pnpm build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/save-content"
  to = "/.netlify/functions/save-content"
  status = 200
  force = true

[[redirects]]
  from = "/api/upload-cv"
  to = "/.netlify/functions/upload-cv"
  status = 200
  force = true

[[redirects]]
  from = "/api/revert-content"
  to = "/.netlify/functions/revert-content"
  status = 200
  force = true

[[redirects]]
  from = "/api/ping"
  to = "/.netlify/functions/ping"
  status = 200
  force = true

# Resume/CV documents: the corrected ENGLISH CV is published. The one-page
# English mini CV and the Spanish and Portuguese CVs are still the superseded
# versions, so only those files stay unreachable by direct or bookmarked URL.
# Must stay ABOVE the SPA catch-all below (first matching rule wins).
# To restore a variant: delete its redirect block and set the matching flag in
# client/src/components/Footer.tsx (CV_DOWNLOAD_ENABLED) back to `true`.
[[redirects]]
  from = "/cv/Franzetti-Mini-CV-English.pdf"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/cv/Franzetti-CV-Spanish.pdf"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/cv/Franzetti-Mini-CV-Spanish.pdf"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/cv/Franzetti-CV-Portuguese.pdf"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/cv/Franzetti-Mini-CV-Portuguese.pdf"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers for Corporate Browser Compliance
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking attacks
    X-Frame-Options = "SAMEORIGIN"
    
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Enable XSS protection
    X-XSS-Protection = "1; mode=block"
    
    # Referrer policy for privacy
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Permissions policy (formerly Feature-Policy)
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    
    # Content Security Policy - allows necessary resources while blocking unsafe ones
    # Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';"
    
    # Strict Transport Security (HSTS) - enforce HTTPS
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Cross-Origin policies for additional security
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
